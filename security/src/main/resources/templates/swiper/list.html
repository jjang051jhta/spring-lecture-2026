<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인 슬라이드 관리</title>

    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        .handle {
            cursor: move;
            user-select: none;
            font-size: 20px;
            font-weight: bold;
            color: #888;
        }

        .handle:hover {
            color: #000;
        }
    </style>
</head>

<body class="bg-base-200 min-h-screen">

<div class="max-w-5xl mx-auto py-10 px-4">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold">
            메인 슬라이드 관리
        </h1>

        <button class="btn btn-primary">
            슬라이드 추가
        </button>
    </div>

    <ul id="slide-list" class="space-y-3">

        <th:block th:each="item : ${mainSlideDtoList}">

            <li class="card bg-base-100 shadow border border-base-300 slide-item"
                th:data-slide-no="${item.slideNo}">

                <!-- padding 축소 -->
                <div class="card-body p-4">

                    <!-- gap 축소 -->
                    <div class="flex items-center gap-4">

                        <!-- Drag Handle -->
                        <div class="handle">
                            ☰
                        </div>

                        <!-- Thumbnail -->
                        <figure class="w-44 shrink-0">
                            <img
                                    th:src="${item.imageUrl}"
                                    class="w-full h-20 object-cover rounded-lg"
                                    alt="">
                        </figure>

                        <!-- Text -->
                        <div class="flex-1">

                            <h2 class="font-bold text-lg leading-6"
                                th:text="${item.mainText}">
                                메인 텍스트
                            </h2>

                            <p class="text-sm text-base-content/70 mt-1 line-clamp-2"
                               th:text="${item.subText}">
                                서브 텍스트
                            </p>

                        </div>

                        <!-- Right -->
                        <div class="flex flex-col items-end gap-2">

                            <label class="label cursor-pointer gap-2 p-0">
                                <span class="label-text text-sm">노출</span>

                                <input
                                        type="checkbox"
                                        class="toggle toggle-primary toggle-sm"
                                        th:checked="${item.visibleYn == 'Y'}">
                            </label>

                            <button class="btn btn-error btn-xs">
                                삭제
                            </button>

                        </div>

                    </div>

                </div>

            </li>

        </th:block>

    </ul>

</div>

<script>
    const slideList = document.querySelector("#slide-list");

    new Sortable(slideList, {
        handle: ".handle",
        animation: 150,

        onEnd: function () {

            const slideItems = [...document.querySelectorAll(".slide-item")];

            const slideNos = slideItems.map(item =>
                Number(item.dataset.slideNo)
            );

            console.log(slideNos);

            fetch("/swiper/admin/sort", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(slideNos)
            });
        }
    });
</script>

</body>
</html>
