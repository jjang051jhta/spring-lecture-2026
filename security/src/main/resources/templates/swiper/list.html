<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메인 슬라이드 관리</title>

    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen">

<div class="max-w-5xl mx-auto py-10 px-4">

    <h1 class="text-3xl font-bold mb-8">
        메인 슬라이드 관리
    </h1>

    <ul id="slide-list" class="space-y-4">

        <th:block th:each="item : ${mainSlideDtoList}">

            <li class="card bg-base-100 shadow-md border border-base-300">

                <div class="card-body">

                    <div class="flex flex-col md:flex-row items-center gap-6">

                        <!-- 이미지 -->
                        <figure class="w-full md:w-60 shrink-0">
                            <img
                                    th:src="${item.imageUrl}"
                                    class="w-full h-32 object-cover rounded-lg"
                                    alt="">
                        </figure>

                        <!-- 내용 -->
                        <div class="flex-1">

                            <h2 class="text-xl font-bold"
                                th:text="${item.mainText}">
                                메인 텍스트
                            </h2>

                            <p class="text-base-content/70 mt-2"
                               th:text="${item.subText}">
                                서브 텍스트
                            </p>

                            <div class="mt-3">
                                <span class="badge badge-outline">
                                    Slide
                                </span>
                            </div>

                        </div>

                        <!-- 버튼 -->
                        <div class="flex flex-col gap-3 items-end">

                            <label class="label cursor-pointer gap-2">
                                <span class="label-text">노출</span>

                                <input
                                        type="checkbox"
                                        class="toggle toggle-primary"
                                        th:checked="${item.visibleYn == 'Y'}">
                            </label>

                            <button class="btn btn-error btn-sm">
                                삭제
                            </button>

                        </div>

                    </div>

                </div>

            </li>

        </th:block>

    </ul>

</div>

</body>
</html>
